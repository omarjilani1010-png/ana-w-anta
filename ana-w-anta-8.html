<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>أنا وانت</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #0a0810;
  --purple:   #2a1a4a;
  --violet:   #4b2d7f;
  --rose:     #8b3a5a;
  --gold:     #c9a84c;
  --gold-lt:  #e8d08a;
  --gold-dim: #7a6230;
  --cream:    #f5efe2;
  --cream2:   #ede4d0;
  --ink:      #140e1e;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  background: radial-gradient(ellipse at 30% 0%, rgba(75,45,127,0.25) 0%, transparent 55%),
              radial-gradient(ellipse at 70% 100%, rgba(139,58,90,0.18) 0%, transparent 50%),
              var(--bg);
  font-family:'Cairo',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

/* ══ SCREENS ══ */
.screen { display:none; min-height:100vh; flex-direction:column; align-items:center; justify-content:center; padding:30px 20px; }
.screen.active { display:flex; }

/* ══ HOME SCREEN ══ */
.home-ornament { display:flex; align-items:center; gap:14px; margin-bottom:20px; }
.h-line { flex:1; max-width:100px; height:1px; background:linear-gradient(90deg,transparent,var(--gold-dim)); }
.h-line.r { background:linear-gradient(90deg,var(--gold-dim),transparent); }
.h-diamond { width:8px; height:8px; background:var(--gold); transform:rotate(45deg); box-shadow:0 0 12px rgba(201,168,76,0.5); }
.home-title { font-family:'Scheherazade New',serif; font-size:clamp(3rem,10vw,5rem); color:var(--gold); letter-spacing:8px; text-shadow:0 0 40px rgba(201,168,76,0.3); text-align:center; }
.home-sub { font-size:0.75rem; color:rgba(245,239,226,0.3); letter-spacing:4px; margin-top:10px; text-transform:uppercase; text-align:center; }

.home-btns { display:flex; flex-direction:column; gap:14px; margin-top:50px; width:100%; max-width:300px; }

.btn-primary {
  background:linear-gradient(135deg,var(--violet),var(--rose));
  color:var(--cream); border:none; border-radius:50px;
  padding:16px 32px; font-family:'Cairo',sans-serif;
  font-size:1rem; font-weight:700; cursor:pointer;
  box-shadow:0 8px 32px rgba(75,45,127,0.4);
  transition:transform .2s, box-shadow .2s;
  letter-spacing:1px;
}
.btn-primary:active { transform:scale(0.97); }

.btn-secondary {
  background:transparent;
  color:var(--gold); border:1px solid rgba(201,168,76,0.35);
  border-radius:50px; padding:14px 32px;
  font-family:'Cairo',sans-serif; font-size:1rem;
  font-weight:600; cursor:pointer;
  transition:all .2s; letter-spacing:1px;
}
.btn-secondary:active { background:rgba(201,168,76,0.08); }

/* ══ INPUT SCREEN ══ */
.input-card {
  background:linear-gradient(150deg,rgba(42,26,74,0.8),rgba(17,12,34,0.9));
  border:1px solid rgba(201,168,76,0.15);
  border-radius:24px; padding:40px 28px;
  width:100%; max-width:340px;
  box-shadow:0 24px 60px rgba(0,0,0,0.5);
  text-align:center;
}
.input-title { font-family:'Scheherazade New',serif; font-size:1.8rem; color:var(--gold); margin-bottom:8px; }
.input-sub { font-size:0.78rem; color:rgba(245,239,226,0.4); margin-bottom:30px; line-height:1.7; }
.input-field {
  width:100%; background:rgba(255,255,255,0.06);
  border:1px solid rgba(201,168,76,0.2); border-radius:14px;
  padding:14px 18px; font-family:'Cairo',sans-serif;
  font-size:1rem; color:var(--cream); outline:none;
  text-align:center; margin-bottom:16px;
  transition:border-color .2s;
}
.input-field:focus { border-color:rgba(201,168,76,0.5); }
.input-field::placeholder { color:rgba(245,239,226,0.25); }
.code-display {
  font-size:2.5rem; font-weight:900; color:var(--gold);
  letter-spacing:12px; margin:20px 0;
  text-shadow:0 0 20px rgba(201,168,76,0.4);
}
.status-dot {
  display:inline-block; width:8px; height:8px;
  border-radius:50%; margin-left:8px;
  animation:pulse 1.5s infinite;
}
.status-dot.waiting { background:#f59e0b; }
.status-dot.connected { background:#10b981; animation:none; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
.status-text { font-size:0.82rem; color:rgba(245,239,226,0.5); margin-top:10px; display:flex; align-items:center; justify-content:center; }

/* ══ GAME SCREEN ══ */
.game-screen { padding:0; justify-content:flex-start; }
.game-header {
  width:100%; padding:18px 24px;
  display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid rgba(201,168,76,0.08);
}
.game-logo { font-family:'Scheherazade New',serif; font-size:1.4rem; color:var(--gold); }
.game-status { font-size:0.72rem; color:rgba(245,239,226,0.4); display:flex; align-items:center; gap:6px; }

.game-body {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:24px 20px; width:100%;
}

/* Question card */
.q-card-game {
  width:100%; max-width:360px;
  background:linear-gradient(150deg,#faf6ee 0%,#f2e9d4 60%,#ece0c4 100%);
  border-radius:20px; padding:36px 28px 32px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.5), 0 4px 12px rgba(0,0,0,0.3),
             inset 0 1px 0 rgba(255,255,255,0.9);
  position:relative; overflow:hidden;
}
.q-card-game::before {
  content:''; position:absolute; top:0; left:0; right:0; height:3px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.q-top-line { width:40px; height:1.5px; background:linear-gradient(90deg,transparent,rgba(139,58,90,0.5),transparent); margin:0 auto 16px; }
.q-num-game { font-size:0.65rem; color:#7a3050; letter-spacing:4px; text-transform:uppercase; margin-bottom:16px; font-weight:700; }
.q-text-game { font-size:1.1rem; font-weight:800; color:var(--ink); line-height:1.9; }
.q-dots-game { display:flex; justify-content:center; gap:6px; margin-top:20px; }
.q-dots-game i { display:block; border-radius:50%; background:rgba(139,58,90,0.4); }
.q-dots-game i:nth-child(1) { width:4px;height:4px; }
.q-dots-game i:nth-child(2) { width:6px;height:6px;background:rgba(139,58,90,0.6); }
.q-dots-game i:nth-child(3) { width:4px;height:4px; }

/* Category badge */
.cat-badge {
  display:inline-block; padding:5px 16px;
  border-radius:50px; font-size:0.7rem; font-weight:700;
  margin-bottom:20px; letter-spacing:1px;
}
.cat-deep    { background:rgba(75,45,127,0.25); color:#b39ddb; border:1px solid rgba(75,45,127,0.3); }
.cat-bold    { background:rgba(139,58,90,0.25); color:#f48fb1; border:1px solid rgba(139,58,90,0.3); }
.cat-romantic{ background:rgba(201,168,76,0.2); color:#e8d08a; border:1px solid rgba(201,168,76,0.25); }

/* Answer section */
.answers-row {
  display:grid; grid-template-columns:1fr 1fr;
  gap:12px; width:100%; max-width:360px; margin-top:20px;
}
.answer-box {
  background:rgba(42,26,74,0.5);
  border:1px solid rgba(201,168,76,0.12);
  border-radius:16px; padding:14px;
  text-align:center; min-height:80px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.answer-box .a-label { font-size:0.65rem; color:rgba(245,239,226,0.35); letter-spacing:2px; margin-bottom:8px; }
.answer-box .a-text { font-size:0.9rem; color:var(--cream); font-weight:600; line-height:1.4; }
.answer-box .a-waiting { font-size:0.75rem; color:rgba(245,239,226,0.2); }

.answer-input-wrap { width:100%; max-width:360px; margin-top:12px; position:relative; }
.answer-input {
  width:100%; background:rgba(42,26,74,0.4);
  border:1px solid rgba(201,168,76,0.2); border-radius:14px;
  padding:14px 60px 14px 18px; font-family:'Cairo',sans-serif;
  font-size:0.95rem; color:var(--cream); outline:none;
  transition:border-color .2s; resize:none; height:56px;
}
.answer-input:focus { border-color:rgba(201,168,76,0.45); }
.answer-input::placeholder { color:rgba(245,239,226,0.2); }
.send-btn {
  position:absolute; left:8px; top:50%; transform:translateY(-50%);
  background:linear-gradient(135deg,var(--violet),var(--rose));
  border:none; border-radius:10px; width:40px; height:40px;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  font-size:1.1rem; transition:transform .15s;
}
.send-btn:active { transform:translateY(-50%) scale(0.93); }

/* Nav buttons */
.game-nav {
  display:flex; gap:12px; margin-top:16px;
  width:100%; max-width:360px;
}
.nav-btn {
  flex:1; background:rgba(42,26,74,0.4);
  border:1px solid rgba(201,168,76,0.15);
  border-radius:14px; padding:13px;
  color:var(--gold); font-family:'Cairo',sans-serif;
  font-size:0.85rem; font-weight:700; cursor:pointer;
  transition:all .2s; letter-spacing:1px;
}
.nav-btn:active { background:rgba(75,45,127,0.4); }
.nav-btn.random {
  background:linear-gradient(135deg,rgba(75,45,127,0.6),rgba(139,58,90,0.5));
  border-color:rgba(201,168,76,0.25);
}

/* Progress */
.progress-wrap { width:100%; max-width:360px; margin-top:14px; }
.progress-bar-bg { background:rgba(255,255,255,0.06); border-radius:10px; height:4px; overflow:hidden; }
.progress-bar-fill { height:100%; background:linear-gradient(90deg,var(--violet),var(--rose)); border-radius:10px; transition:width .4s ease; }
.progress-text { font-size:0.65rem; color:rgba(245,239,226,0.25); text-align:center; margin-top:6px; letter-spacing:2px; }

/* Timer */
.timer-wrap { display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:16px; }
.timer-circle {
  width:48px; height:48px; border-radius:50%;
  background:conic-gradient(var(--gold) 0deg, rgba(255,255,255,0.06) 0deg);
  display:flex; align-items:center; justify-content:center;
  font-size:0.85rem; font-weight:700; color:var(--gold);
  position:relative; transition:background 1s linear;
}

/* Overlay for reveal */
.reveal-overlay {
  position:fixed; inset:0; background:rgba(6,5,13,0.97);
  display:none; align-items:center; justify-content:center;
  z-index:999; flex-direction:column; gap:20px; padding:30px;
}
.reveal-overlay.show { display:flex; animation:fadeIn .3s ease; }
@keyframes fadeIn { from{opacity:0;transform:scale(0.95)} to{opacity:1;transform:scale(1)} }
.reveal-title { font-family:'Scheherazade New',serif; font-size:1.5rem; color:var(--gold); text-align:center; }
.reveal-cards { display:grid; grid-template-columns:1fr 1fr; gap:14px; width:100%; max-width:360px; }
.reveal-card { background:linear-gradient(150deg,rgba(42,26,74,0.9),rgba(17,12,34,0.95)); border:1px solid rgba(201,168,76,0.2); border-radius:16px; padding:18px 14px; text-align:center; }
.reveal-name { font-size:0.65rem; color:var(--gold); letter-spacing:2px; margin-bottom:10px; }
.reveal-ans { font-size:0.95rem; color:var(--cream); font-weight:700; line-height:1.5; }
.reveal-close { margin-top:10px; }

/* Loader */
.loader { display:inline-block; width:32px; height:32px; border:3px solid rgba(201,168,76,0.15); border-top-color:var(--gold); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to{transform:rotate(360deg)} }

/* Back btn */
.back-btn { position:absolute; top:18px; right:20px; background:none; border:none; color:rgba(245,239,226,0.4); font-size:1.2rem; cursor:pointer; padding:4px; }

/* Music btn */
.music-btn {
  position:fixed; bottom:20px; left:20px; z-index:100;
  width:42px; height:42px; border-radius:50%;
  background:rgba(42,26,74,0.8);
  border:1px solid rgba(201,168,76,0.3);
  color:var(--gold); font-size:1.1rem;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 16px rgba(0,0,0,0.4);
  transition:all .2s;
}
.music-btn:active { transform:scale(0.93); }

/* Points bar */
.points-bar {
  display:flex; justify-content:space-between; align-items:center;
  width:100%; max-width:360px;
  background:rgba(42,26,74,0.4);
  border:1px solid rgba(201,168,76,0.12);
  border-radius:14px; padding:10px 18px;
  margin-bottom:12px;
}
.point-side { text-align:center; }
.point-name { font-size:0.62rem; color:rgba(245,239,226,0.35); letter-spacing:2px; margin-bottom:4px; }
.point-score { font-size:1.4rem; font-weight:900; color:var(--gold); }
.point-vs { font-size:0.75rem; color:rgba(245,239,226,0.2); font-weight:700; }

/* Chat */
.chat-wrap {
  position:fixed; bottom:0; left:0; right:0; z-index:200;
  background:rgba(10,8,16,0.97);
  border-top:1px solid rgba(201,168,76,0.15);
  transform:translateY(100%);
  transition:transform .3s ease;
  max-height:60vh; display:flex; flex-direction:column;
}
.chat-wrap.open { transform:translateY(0); }
.chat-header {
  display:flex; justify-content:space-between; align-items:center;
  padding:14px 20px;
  border-bottom:1px solid rgba(201,168,76,0.08);
}
.chat-title { font-family:'Scheherazade New',serif; font-size:1.1rem; color:var(--gold); }
.chat-close { background:none; border:none; color:rgba(245,239,226,0.4); font-size:1.3rem; cursor:pointer; }
.chat-messages {
  flex:1; overflow-y:auto; padding:14px 16px;
  display:flex; flex-direction:column; gap:10px;
  min-height:120px;
}
.chat-msg { max-width:75%; padding:10px 14px; border-radius:16px; font-size:0.88rem; line-height:1.5; }
.chat-msg.mine { background:linear-gradient(135deg,rgba(75,45,127,0.7),rgba(139,58,90,0.5)); color:var(--cream); align-self:flex-end; border-bottom-left-radius:4px; }
.chat-msg.theirs { background:rgba(42,26,74,0.5); color:var(--cream); align-self:flex-start; border-bottom-right-radius:4px; border:1px solid rgba(201,168,76,0.1); }
.chat-msg-name { font-size:0.6rem; color:var(--gold); margin-bottom:4px; opacity:0.7; }
.chat-input-row { display:flex; gap:8px; padding:12px 16px; border-top:1px solid rgba(201,168,76,0.08); }
.chat-input {
  flex:1; background:rgba(42,26,74,0.4);
  border:1px solid rgba(201,168,76,0.2); border-radius:12px;
  padding:10px 14px; font-family:'Cairo',sans-serif;
  font-size:0.9rem; color:var(--cream); outline:none;
}
.chat-input::placeholder { color:rgba(245,239,226,0.2); }
.chat-send {
  background:linear-gradient(135deg,var(--violet),var(--rose));
  border:none; border-radius:12px; width:42px; height:42px;
  color:white; font-size:1rem; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}

/* Chat btn */
.chat-btn {
  position:fixed; bottom:20px; right:20px; z-index:100;
  width:42px; height:42px; border-radius:50%;
  background:rgba(42,26,74,0.8);
  border:1px solid rgba(201,168,76,0.3);
  color:var(--gold); font-size:1.1rem;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 16px rgba(0,0,0,0.4);
  transition:all .2s;
}
.chat-btn.has-msg { border-color:var(--rose); }

/* Stop game btn */
.stop-btn {
  width:100%; max-width:360px; margin-top:8px;
  background:rgba(139,58,90,0.2);
  border:1px solid rgba(139,58,90,0.3);
  border-radius:14px; padding:11px;
  color:rgba(248,180,180,0.7); font-family:'Cairo',sans-serif;
  font-size:0.82rem; font-weight:700; cursor:pointer;
  transition:all .2s; letter-spacing:1px;
}
.stop-btn:active { background:rgba(139,58,90,0.4); }
</style>
</head>
<body>

<!-- HOME -->
<div class="screen active" id="homeScreen">
  <div class="home-ornament">
    <div class="h-line"></div><div class="h-diamond"></div><div class="h-line r"></div>
  </div>
  <div class="home-title">أنا وانت</div>
  <div class="home-sub">٦٥ سؤال · للمرتبطين</div>
  <div class="home-btns">
    <button class="btn-primary" onclick="showCreate()">✦ إنشاء غرفة</button>
    <button class="btn-secondary" onclick="showJoin()">الانضمام لغرفة</button>
  </div>
</div>

<!-- CREATE ROOM -->
<div class="screen" id="createScreen">
  <button class="back-btn" onclick="goHome()">←</button>
  <div class="input-card">
    <div class="input-title">غرفتك الخاصة</div>
    <div class="input-sub">اكتب اسمك وشارك الكود مع حبيبتك</div>
    <input class="input-field" id="createName" placeholder="اسمك..." maxlength="20">
    <button class="btn-primary" style="width:100%;margin-top:8px" onclick="createRoom()">إنشاء الغرفة ✦</button>
    <div id="createResult" style="margin-top:24px;display:none">
      <div style="font-size:0.7rem;color:rgba(245,239,226,0.35);letter-spacing:3px;margin-bottom:8px">كود الغرفة</div>
      <div class="code-display" id="roomCodeDisplay">----</div>
      <button class="btn-secondary" style="width:100%;margin-top:8px;font-size:0.85rem" onclick="copyCode()">نسخ الكود 📋</button>
      <div class="status-text">
        <span id="waitText">بانتظار حبيبتك...</span>
        <span class="status-dot waiting" id="waitDot"></span>
      </div>
    </div>
  </div>
</div>

<!-- JOIN ROOM -->
<div class="screen" id="joinScreen">
  <button class="back-btn" onclick="goHome()">←</button>
  <div class="input-card">
    <div class="input-title">انضم للغرفة</div>
    <div class="input-sub">اكتب اسمك والكود اللي بعثه لك</div>
    <input class="input-field" id="joinName" placeholder="اسمك..." maxlength="20">
    <input class="input-field" id="joinCode" placeholder="كود الغرفة (4 أرقام)" maxlength="4" style="letter-spacing:8px;font-size:1.3rem;font-weight:700">
    <button class="btn-primary" style="width:100%;margin-top:8px" onclick="joinRoom()">دخول ✦</button>
    <div id="joinLoader" style="display:none;text-align:center;margin-top:20px"><div class="loader"></div></div>
    <div id="joinError" style="display:none;margin-top:12px;font-size:0.82rem;color:#f48fb1;text-align:center"></div>
  </div>
</div>

<!-- GAME -->
<div class="screen game-screen" id="gameScreen">
  <div class="game-header">
    <div class="game-logo">أنا وانت</div>
    <div class="game-status">
      <span class="status-dot connected"></span>
      <span id="partnerStatusText">متصلين</span>
    </div>
  </div>

  <div class="game-body">
    <!-- Points bar -->
    <div class="points-bar" id="pointsBar" style="width:100%;max-width:360px;margin-bottom:10px">
      <div class="point-side">
        <div class="point-name" id="pName1">أنت</div>
        <div class="point-score" id="pScore1">0</div>
      </div>
      <div class="point-vs">VS</div>
      <div class="point-side">
        <div class="point-name" id="pName2">هي</div>
        <div class="point-score" id="pScore2">0</div>
      </div>
    </div>

    <!-- Timer -->
    <div class="timer-wrap">
      <div class="timer-circle" id="timerCircle">
        <span id="timerNum">60</span>
      </div>
    </div>

    <!-- Category badge -->
    <div id="catBadge" class="cat-badge cat-romantic">رومانسي ♥</div>

    <!-- Question card -->
    <div class="q-card-game">
      <div class="q-top-line"></div>
      <div class="q-num-game" id="qNumGame">السؤال 1</div>
      <div class="q-text-game" id="qTextGame">جاري تحميل السؤال...</div>
      <div class="q-dots-game"><i></i><i></i><i></i></div>
    </div>

    <!-- Progress -->
    <div class="progress-wrap">
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress-text" id="progressText">0 / 65</div>
    </div>

    <!-- Answers -->
    <div class="answers-row">
      <div class="answer-box">
        <div class="a-label" id="myLabel">أنت</div>
        <div class="a-text" id="myAnswerDisplay"><span class="a-waiting">لم تجب بعد</span></div>
      </div>
      <div class="answer-box">
        <div class="a-label" id="partnerLabel">هي</div>
        <div class="a-text" id="partnerAnswerDisplay"><span class="a-waiting">بانتظارها...</span></div>
      </div>
    </div>

    <!-- Input -->
    <div class="answer-input-wrap">
      <textarea class="answer-input" id="myAnswer" placeholder="إجابتك..." rows="1"></textarea>

function playMelody() {
  if(!musicPlaying) return;
  try {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    // Romantic melody - longer notes, more musical
    const melody = [
      {f:392,d:0.8},{f:440,d:0.4},{f:494,d:0.4},{f:523,d:1.2},
      {f:494,d:0.4},{f:440,d:0.4},{f:392,d:0.8},{f:349,d:1.2},
      {f:330,d:0.8},{f:349,d:0.4},{f:392,d:0.4},{f:440,d:1.2},
      {f:392,d:0.8},{f:349,d:0.4},{f:330,d:0.4},{f:294,d:1.6},
    ];
    
    let t = audioCtx.currentTime + 0.1;
    melody.forEach(({f,d}) => {
      // Main note
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = 'sine'; osc.frequency.value = f;
      gain.gain.setValueAtTime(0,t);
      gain.gain.linearRampToValueAtTime(0.12, t+0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, t+d-0.05);
      osc.start(t); osc.stop(t+d);
      
      // Harmony (lower octave)
      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.connect(gain2); gain2.connect(audioCtx.destination);
      osc2.type = 'sine'; osc2.frequency.value = f/2;
      gain2.gain.setValueAtTime(0,t);
      gain2.gain.linearRampToValueAtTime(0.05, t+0.1);
      gain2.gain.exponentialRampToValueAtTime(0.001, t+d-0.05);
      osc2.start(t); osc2.stop(t+d);
      
      t += d;
    });
    
    const total = melody.reduce((a,b)=>a+b.d,0);
    setTimeout(()=>{ if(musicPlaying) playMelody(); }, total*1000);
  } catch(e) { console.log('audio error',e); }
}

  if(pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(async()=>{
    const rows = await dbGet('game_rooms','id',roomId);
    if(!rows||!rows[0]) return;
    const room = rows[0];
    const partnerAns = isHost ? room.guest_answer : room.host_answer;
    const myAns = isHost ? room.host_answer : room.guest_answer;
    if(partnerAns) document.getElementById('partnerAnswerDisplay').textContent = partnerAns;

    if(myAns && partnerAns && !document.getElementById('revealOverlay').classList.contains('show')) {

      document.getElementById('revealPartnerAns').textContent = partnerAns;

}

function stopPolling() { if(pollInterval) { clearInterval(pollInterval); pollInterval=null; } }

function closeReveal() {
  document.getElementById('revealOverlay').classList.remove('show');
  // reset answers in db
  dbUpdate('game_rooms','id',roomId,{host_answer:null,guest_answer:null});
}

function changeQ(newQ) {
  currentQ = newQ;
  if(!usedQuestions.includes(currentQ)) usedQuestions.push(currentQ);
  loadQuestion();
  // Sync to DB so partner sees same question
  dbUpdate('game_rooms','id',roomId,{current_q:currentQ,host_answer:null,guest_answer:null});
}

function nextQ() {
  const next = currentQ < 64 ? currentQ+1 : 0;
  changeQ(next);
}
function prevQ() {
  const prev = currentQ > 0 ? currentQ-1 : 0;
  changeQ(prev);
}
function randomQ() {
  const remaining = [...Array(65).keys()].filter(i=>!usedQuestions.includes(i));
  if(remaining.length === 0) {
    usedQuestions = [];
    alert('أنهيتم كل الأسئلة! 🎉 بنبدأ من جديد');
    changeQ(0);
  } else {
    changeQ(remaining[Math.floor(Math.random()*remaining.length)]);
  }
}

// ── Timer ──
function resetTimer() {
  if(timerInterval) clearInterval(timerInterval);
  timerSec=60;
  updateTimerUI();
  timerInterval=setInterval(()=>{
    timerSec--;
    updateTimerUI();
    if(timerSec<=0) { clearInterval(timerInterval); }
  },1000);
}
function updateTimerUI() {
  const el=document.getElementById('timerNum');
  const circle=document.getElementById('timerCircle');
  el.textContent=timerSec;
  const deg=Math.round((timerSec/60)*360);
  const color = timerSec>20 ? 'var(--gold)' : timerSec>10 ? '#f59e0b' : '#ef4444';
  circle.style.background=`conic-gradient(${color} ${deg}deg, rgba(255,255,255,0.06) ${deg}deg)`;
  el.style.color=color;
}
</script>
